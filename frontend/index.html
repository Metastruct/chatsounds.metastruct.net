<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <title>Chatsounds - Meta Construct</title>
    <meta
      name="description"
      content="Cut a file into named chatsound clips, sort them into groups, and upload/prepare them for review."
    />
    <link rel="canonical" href="https://chatsounds.metastruct.net/" />
    <!-- What mobile browsers paint their chrome with: the page's own background,
         so the seam does not show. -->
    <meta name="theme-color" content="#212121" />

    <!-- Open Graph, which is what Discord, Steam and most chat clients read.
         Absolute URLs on purpose: a relative one resolves against the scraper
         rather than this site, and the preview quietly loses its image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meta Construct" />
    <meta property="og:url" content="https://chatsounds.metastruct.net/" />
    <meta property="og:title" content="Chatsounds for Garry's Mod" />
    <meta
      property="og:description"
      content="Cut a file into named chatsound clips, sort them into groups, and upload/prepare them for review."
    />
    <meta property="og:image" content="https://chatsounds.metastruct.net/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Chatsounds for Garry's Mod, with the Meta Construct mark and a waveform."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chatsounds for Garry's Mod" />
    <meta
      name="twitter:description"
      content="Cut a file into named chatsound clips, sort them into groups, and upload/prepare them for review."
    />
    <meta name="twitter:image" content="https://chatsounds.metastruct.net/og-card.png" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/og-card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
