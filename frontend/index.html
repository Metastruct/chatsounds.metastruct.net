<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <title>Chatsounds - Meta Construct</title>
    <meta
      name="description"
      content="Cut a file into named chatsound clips, sort them into groups, and upload/prepare them for review."
    />
    <link rel="canonical" href="https://chatsounds.metastruct.net/" />
    <!-- What mobile browsers paint their chrome with: the page's own background,
         so the seam does not show. -->
    <meta name="theme-color" content="#212121" />

    <!-- Open Graph, which is what Discord, Steam and most chat clients read.
         Deliberately no og:image: a full width graphic in every embed is more
         than a link to a tool needs, and without one the same tags render as a
         compact title and description. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meta Construct" />
    <meta property="og:url" content="https://chatsounds.metastruct.net/" />
    <meta property="og:title" content="Chatsounds" />
    <meta
      property="og:description"
      content="Cut a file into named chatsound clips, sort them into groups, and upload/prepare them for review."
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
