<?xml version="1.0" encoding="UTF-8"?>
<!--
  The link preview card, at the 1200x630 every platform crops from.

  Source for public/og-card.png, which is what actually gets served: platforms
  will not render SVG previews. Regenerate with
      rsvg-convert -w 1200 -h 630 public/og-card.svg -o public/og-card.png
  Colours are the site's own tokens, so a shared link looks like the page it
  opens.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="55%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- The metastruct slashes, redrawn at card scale. -->
  <g transform="translate(96 96)">
    <polygon points="0,84 34,0 66,0 32,84" fill="#6e2f6d"/>
    <polygon points="42,84 76,0 108,0 74,84" fill="#7d3b80"/>
    <polygon points="84,84 118,0 150,0 116,84" fill="#944091"/>
  </g>

  <text x="96" y="300" fill="#fefefe" font-family="'Open Sans', 'Segoe UI', system-ui, sans-serif"
        font-size="78" font-weight="700">chatsounds</text>
  <text x="96" y="378" fill="#09b387" font-family="'Open Sans', 'Segoe UI', system-ui, sans-serif"
        font-size="42" font-weight="600">for Garry's Mod</text>

  <!-- Kept in step with the description in index.html; a card that says
       something different from the text beside it looks like a mistake. -->
  <text x="96" y="470" fill="#bdbdbd" font-family="'Open Sans', 'Segoe UI', system-ui, sans-serif"
        font-size="32">Cut a file into named chatsound clips, sort them</text>
  <text x="96" y="514" fill="#bdbdbd" font-family="'Open Sans', 'Segoe UI', system-ui, sans-serif"
        font-size="32">into groups, and upload them for review.</text>

  <!-- A waveform, since that is what the tool shows you most of the time. -->
  <g fill="#09b387" opacity="0.85">
    <rect x="820" y="300" width="8" height="40" rx="4"/>
    <rect x="838" y="276" width="8" height="88" rx="4"/>
    <rect x="856" y="240" width="8" height="160" rx="4"/>
    <rect x="874" y="290" width="8" height="60" rx="4"/>
    <rect x="892" y="210" width="8" height="220" rx="4"/>
    <rect x="910" y="264" width="8" height="112" rx="4"/>
    <rect x="928" y="300" width="8" height="40" rx="4"/>
    <rect x="946" y="230" width="8" height="180" rx="4"/>
    <rect x="964" y="284" width="8" height="72" rx="4"/>
    <rect x="982" y="252" width="8" height="136" rx="4"/>
    <rect x="1000" y="296" width="8" height="48" rx="4"/>
    <rect x="1018" y="266" width="8" height="108" rx="4"/>
    <rect x="1036" y="238" width="8" height="164" rx="4"/>
    <rect x="1054" y="292" width="8" height="56" rx="4"/>
    <rect x="1072" y="272" width="8" height="96" rx="4"/>
  </g>

  <text x="96" y="580" fill="#6e6e6e" font-family="'Open Sans', 'Segoe UI', system-ui, sans-serif"
        font-size="26">chatsounds.metastruct.net</text>
</svg>
